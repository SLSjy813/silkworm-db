<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丝路四季 · 家蚕分龄四季气候适配数据库</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f7f9fc;padding:24px;max-width:1400px;margin:0 auto;}
h1{text-align:center;color:#2c3e50;margin-bottom:8px;font-size:26px;}
.desc{text-align:center;color:#666;margin-bottom:22px;}
.search-box{margin-bottom:20px;}
#search{width:100%;padding:12px 16px;font-size:16px;border:1px solid #cbd5e0;border-radius:8px;outline:none;}
#search:focus{border-color:#2b6cb0;}
.table-wrap{overflow-x:auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.08);}
table{width:100%;border-collapse:collapse;min-width:1200px;}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px;}
th{background:#2b6cb0;color:#fff;font-weight:500;}
tr:hover{background:#f0f7ff;}
.footer{margin-top:24px;text-align:center;color:#888;font-size:14px;}
</style>
</head>
<body>
<h1>丝路四季 · 家蚕分龄四季气候适配数据库</h1>
<div class="desc">分小蚕/大蚕期温湿度参数｜四季适配选型｜智能养蚕环境参数库</div>

<div class="search-box">
  <input id="search" placeholder="🔍 搜索品种、季节、温湿度、饲养要点..." />
</div>

<div class="table-wrap">
<table id="dataTable">
  <thead>
    <tr>
      <th>库编号</th>
      <th>蚕品种</th>
      <th>适宜饲养季节</th>
      <th>小蚕期温湿度</th>
      <th>大蚕期温湿度</th>
      <th>整体气候要求</th>
      <th>核心饲养要点</th>
      <th>禁忌与注意事项</th>
    </tr>
  </thead>
  <tbody id="tableBody">
  </tbody>
</table>
</div>

<div class="footer">
本数据库为四季循环养蚕系统提供标准化环境阈值参数｜数据由蚕桑试验基地实测校准
</div>

<script>
// 蚕品种数据库完整数据（可自主增删修改）
const dataList = [
  {
    code:"CAN-001-QF-BY",
    name:"秋丰×白玉",
    season:"春季、秋季最优；夏季可养；冬季加温可控饲养",
    tempSmall:"25.5-27℃，湿度85%-90%",
    tempBig:"23-25℃，湿度75%-80%",
    climate:"适应性强，耐温差小，适合规模化多批次循环养殖；需通风干爽环境，忌长期闷热高湿",
    keyPoint:"小蚕高温高湿保发育整齐；大蚕低温通风保茧质；按时扩座、匀座、良桑饱食；批次化管理控密度",
    notice:"夏季高温易爆发血液型脓病；冬季自然低温发育迟缓，必须地暖加温稳温；大蚕切忌闷湿"
  },
  {
    code:"CAN-002-HJJ-01",
    name:"黄金茧（彩色茧品种）",
    season:"春季、秋季适宜；夏季慎养；冬季加温精细饲养",
    tempSmall:"26-27.5℃，湿度83%-88%",
    tempBig:"24-26℃，湿度73%-78%",
    climate:"体质偏弱、喜温和气候，不耐极端高温高湿，昼夜温差需控制在2-3℃以内",
    keyPoint:"全程精细化管理，桑叶要求鲜嫩无泥沙无发热；小蚕严格恒温保湿；大蚕加强通风、稀座饲养",
    notice:"抗逆性差，高温易减收、易僵病；湿度偏高极易发霉死蚕；不适合粗放夏季养殖"
  },
  {
    code:"CAN-003-JS-HY",
    name:"菁松×皓月",
    season:"春、秋主养品种，稳定性强，四季适配性优秀",
    tempSmall:"25-27℃，湿度84%-89%",
    tempBig:"22.5-24.5℃，湿度74%-79%",
    climate:"体质强健、发育整齐，耐饲养，适合多批次连续生产，环境容错率高",
    keyPoint:"小蚕期保温保湿保证群体整齐；大蚕期通风换气，杜绝高温闷热；合理用叶、适时眠起处理",
    notice:"高湿环境易诱发曲霉病；夏季需降温除湿，避免连续30℃以上环境饲养"
  }
];

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('search');

// 渲染表格数据
function render(list){
  tableBody.innerHTML = '';
  list.forEach(item=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.code}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.season}</td>
      <td>${item.tempSmall}</td>
      <td>${item.tempBig}</td>
      <td>${item.climate}</td>
      <td>${item.keyPoint}</td>
      <td>${item.notice}</td>
    `;
    tableBody.appendChild(tr);
  })
}

// 初始渲染全部数据
render(dataList);

// 全局模糊搜索功能
searchInput.addEventListener('input',function(){
  const kw = this.value.trim().toLowerCase();
  const filter = dataList.filter(d=>{
    return Object.values(d).some(v=>String(v).toLowerCase().includes(kw))
  })
  render(filter);
})
</script>
</body>
</html>
